services:
  - type: web
    name: sparta-bot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SELF_PING_EVERY
        value: 120
      - key: STALL_SEC
        value: 150
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: PAYMENT_INFO
        sync: false
      - key: CACHE_CHANNEL
        sync: false
      - key: BOT_NAME
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: MAX_FILE_MB
        sync: false
      - key: SELF_PING_URL
        sync: false
