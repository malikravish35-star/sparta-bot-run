name: Keep SPARTA-BOT awake

on:
  schedule:
    - cron: "*/10 * * * *"     # har 10 minute
  workflow_dispatch:            # manually bhi chala sakte ho

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://sparta-src-bot.onrender.com/"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" -m 90 "$URL" || echo 000)
            echo "try $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ bot zinda hai:"; cat /tmp/body.txt; echo
              exit 0
            fi
            sleep 20
          done
          echo "⚠️ 5 try ke baad bhi 200 nahi mila (service jag rahi ho sakti hai)"
          exit 0
